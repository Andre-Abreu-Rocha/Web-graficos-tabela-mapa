 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graficos</title>

    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

 </head>
<body>
    <div class="container">
        <a href="index.html""><h5>Retorna ao menu</h5></a><br><br>
            <div style="width:80%;height:400px">
                <label><h2>Gráfico de barras</h2></label>
                <canvas id="meuGrafico" ></canvas>
            </div>

            <br>
            <br>
            <br>
            <br>


            <div style="width:80%;height:400px">
            <label><h2>Gráfico de linhas</h2></label>
            <canvas id="meuGrafico-linha" ></canvas>
            </div>

            <br>
            <br>
            <br>
            <br>


            <div style="width:80%;height:400px">
                <label><h2>Gráfico de pizza</h2></label>
                <canvas id="meuGrafico-pizza" ></canvas>
            </div>
    </div>

<!--Script grafico de barras ///////////////////////////////////////////////////////////////////-->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const grf = document.getElementById('meuGrafico');



new Chart(grf, { /* criação do objeto de gráfico */
type: 'bar', /* tipo do gráfico */
data: { /* dados */
labels: ['João', 'Maria', 'Pedro', 'Ana', 'Lucas', 'Beatriz', 'Rafael', 'Camila', 'Gabriel', 'Larissa', 'Felipe', 'Juliana', 'Thiago', 'Isabela', 'Vinicius', 'Larissa', 'Felipe', 'Juliana', 'Thiago', 'Isabela'], /*vetor com os nomes das colunas */
datasets: [{
label: 'Alunos', /*vetor com os nomes das linhas */
data: [7.375, 8.75, 6.625, 8.625, 5.625, 8.5, 7.625, 8.75, 6.5, 8.625, 7.625, 8.625, 5.35, 8.625, 7.5, 8.625, 7.625, 8.625, 5.35, 8.625], /*vetor que possui os dados*/
borderWidth: 1,
		backgroundColor: ['blue'] /*vetor com as cores selecionadas */
}]
},
options: {
	 responsive: true, /*grafico responsivo */
maintainAspectRatio: false, /*para não manter a proporção */	
scales: {
y: {
beginAtZero: true
}
}
}
});
</script>


<!--Script grafico de linhas ///////////////////////////////////////////////////////////////////-->


<script>
const grf1 = document.getElementById('meuGrafico-linha');
new Chart(grf1, { /* criação do objeto de gráfico */
type: 'line', /* tipo do gráfico */
data: { /* dados */
labels: ['1º Sem.', '2º Sem.', '3º Sem.','4º Sem.'], //ref ao grafico inteiro
datasets: [
	
	 { //inicio do dataset do joao
label: 'Joao', //label desse dataset
data: [5.5,8,7,9], /*vetor que possui os dados desse dataset*/
borderWidth: 1,
		backgroundColor: 'red' /*cor desse dataset */
}, // tudo que possui mais de um dado vai ser um vetor utilizado , para separar os valores.
	
	
	 { //inicio do dataset do bock
label: 'Maria', //label desse dataset
data: [9,8.5,7.5,10], /*vetor que possui os dados desse dataset*/
borderWidth: 1,
		backgroundColor: 'blue' /*cor desse dataset */
},

	 { //inicio do dataset do bock
label: 'Pedro', //label desse dataset
data: [6,7,5.5,8], /*vetor que possui os dados desse dataset*/
borderWidth: 1,
		backgroundColor: 'yellow' /*cor desse dataset */
},


	 { //inicio do dataset do bock
label: 'Ana', //label desse dataset
data: [8.5,9,7.5,9.5], /*vetor que possui os dados desse dataset*/
borderWidth: 1,
		backgroundColor: 'green' /*cor desse dataset */
}




		 ]
},
options: {
	 responsive: true, /*grafico responsivo */
maintainAspectRatio: false, /*para não manter a proporção */	
scales: {
y: {
beginAtZero: false //nesse caso não inicia no 0 devido os valores
}
}
}
});
</script>



<!--Script grafico de pizza ///////////////////////////////////////////////////////////////////-->

<script>
const grf2 = document.getElementById('meuGrafico-pizza');
new Chart(grf2, { /* criação do objeto de gráfico */
type: 'pie', /* tipo do gráfico */
data: { /* dados */
labels: ['Aprovados', 'Reprovados'], //ref ao grafico inteiro
datasets: [
	
	 { //inicio do dataset do joao
label: 'Alunos',
data: [17, 3], /* quantidade de alunos por conceito */
borderWidth: 1,
		backgroundColor: ['green', 'red'] /*cor desse dataset */
} // tudo que possui mais de um dado vai ser um vetor utilizado , para separar os valores.



 ]
},
options: {
	 responsive: true, /*grafico responsivo */
maintainAspectRatio: false /*para não manter a proporção */
}
});

</script>
