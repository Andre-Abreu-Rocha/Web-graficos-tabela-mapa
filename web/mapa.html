<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Mauá - SP</title>
 
    <!-- CSS do Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
 
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
 
        h2 {
            text-align: center;
            padding: 10px;
        }
 
        #mapa {
            height: 85vh;
            width: 100%;
        }
    </style>
</head>
<body>
 
    <h2>Mapa de Mauá - SP</h2>
    <div id="mapa"></div>
 
    <!-- JavaScript do Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 
    <script>
        // Criando o mapa e definindo o zoom inicial
        const mapa = L.map('mapa').setView(
            [-23.6677, -46.4613], 13
        );
 
        // Camada de mapa base
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(mapa);
 
        // Marcador da Etec Mauá
        L.marker([-23.6656, -46.4619])
            .addTo(mapa)
            .bindPopup('<b>Etec Mauá</b>');
 
        // Marcador da Fatec Mauá
        L.marker([-23.6680, -46.4600])
            .addTo(mapa)
            .bindPopup('<b>Fatec Mauá</b>');
 
        // Marcador da Prefeitura de Mauá
        L.marker([-23.6685, -46.4615])
            .addTo(mapa)
            .bindPopup('<b>Prefeitura do Município de Mauá</b>');
 
        // Camada de limites do município
        const limitesMunicipio =
            'https://geo.cati.sp.gov.br/server/rest/services/Hosted/IGC_Limites_municipais/FeatureServer/0/query?where=nome%3D%27Mau%C3%A1%27&outFields=nome&returnGeometry=true&outSR=4326&f=geojson';
 
        fetch(limitesMunicipio)
            .then(resposta => resposta.json())
            .then(dados => {
                L.geoJSON(dados, {
                    style: {
                        color: 'black',
                        weight: 3,
                        fillColor: '#ffcccb',
                        fillOpacity: 0.15
                    }
                }).addTo(mapa);
            })
            .catch(erro => {
                console.error(
                    'Erro ao carregar os limites do município:',
                    erro
                );
            });
    </script>
 
</body>
</html>
