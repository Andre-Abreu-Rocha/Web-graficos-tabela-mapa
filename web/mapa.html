<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Mauá</title>

    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!--Biblioteca do mapa Leaflet-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></head>



</head>

<!-- css leaflet para utilizar em conjunto com open street map-->
	  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
	
		<!--css leaflet -->
		
		<style>
		#map {
            height: 500px;   /* altura do mapa */
            width: 80%;      /* largura */
            margin: auto;    /* centraliza */
            border: 2px solid #ccc;
            border-radius: 10px;
        }
    </style>
		</style>


<body>
    <a href="index.html">Retornar ao menu</a>

    <body class="bg-light">
	

	

		 <div class="row">
		   <div class=col-md-1></div>
		   <div class=col-md-10>
				<div id="map"></div>
		   </div>
		   <div class=col-md-1></div>
		</div>




</div>   



<!--script do plugin de mapas -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- plugin para exibir kml-->
<script src="https://unpkg.com/leaflet-omnivore/leaflet-omnivore.min.js"></script>

<script>
    // Cria o mapa dentro da div "map"
    var map = L.map('map').setView([-23.66, -46.46], 10); //latitude e longitude inicial do mapa e 10 é o zoom do mapa

    // Adiciona o mapa base do OpenStreetMap 
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);
	
	

    // adicionando pontos no mapa formato json
    var pessoas = [
	 
    
        { nome: "João", lat: -23.66, lng: -46.46 },
        { nome: "Maria", lat: -23.55, lng: -46.63 },
        { nome: "Pedro", lat: -23.80, lng: -46.50 }
    
	]
        ;

    // Loop para plotar os pontos no mapa com base no vetor acima
    pessoas.forEach(function(p) {
        L.marker([p.lat, p.lng])
            .addTo(map)
            .bindPopup(p.nome);
    });
</script>





</body>
</html>
